
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
          content="Cadastre veículos na EstetickElite.">

    <title>Cadastrar Veículo | EstetickElite</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- CABEÇALHO -->
<div th:replace="~{fragments :: header}"></div>

<!-- CONTEÚDO PRINCIPAL -->
<main class="cadastro-main">

    <section class="cadastro">

        <p class="eyebrow">ESTETICKELITE</p>

        <h1>Cadastrar veículo</h1>

        <p class="cadastro-intro">
            Cadastre um veículo e vincule-o ao seu proprietário.
        </p>

        <form th:action="@{/veiculos/salvar}"
              th:object="${veiculo}"
              method="post">

            <!-- PLACA -->
            <div class="mb-3">

                <label class="form-label">Placa</label>

                <input type="text"
                       th:field="*{placa}"
                       class="form-control"
                       maxlength="7"
                       minlength="7"
                       pattern="[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}"
                       placeholder="ABC1D23"
                       oninput="this.value = this.value.toUpperCase().replace(/\s/g, '')"
                       required>

            </div>

            <!-- MARCA -->
            <div class="mb-3">

                <label class="form-label">Marca</label>

                <input type="text"
                       th:field="*{marca}"
                       class="form-control"
                       placeholder="Ex.: Volkswagen"
                       required>

            </div>

            <!-- MODELO -->
            <div class="mb-3">

                <label class="form-label">Modelo</label>

                <input type="text"
                       th:field="*{modelo}"
                       class="form-control"
                       placeholder="Ex.: Bora"
                       required>

            </div>

            <!-- ANO -->
            <div class="mb-3">

                <label class="form-label">Ano</label>

                <input type="number"
                       th:field="*{ano}"
                       class="form-control"
                       min="1900"
                       max="2100"
                       placeholder="Ex.: 2010"
                       required>

            </div>

            <!-- COR -->
            <div class="mb-3">

                <label class="form-label">Cor</label>

                <input type="text"
                       th:field="*{cor}"
                       class="form-control"
                       placeholder="Ex.: Preto"
                       required>

            </div>

            <!-- PROPRIETÁRIO -->
            <div class="mb-4">

                <label class="form-label">Proprietário</label>

                <select name="clienteId"
                        class="form-control"
                        required>

                    <option value="">
                        Selecione um cliente
                    </option>

                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.id}"
                            th:text="${cliente.nome}">
                    </option>

                </select>

            </div>

            <!-- BOTÕES -->
            <div class="d-flex flex-column gap-3">

                <button type="submit"
                        class="btn-estetick w-100">
                    Cadastrar veículo
                </button>

                <a th:href="@{/veiculos/listar}"
                   class="btn-cadastrar text-center">
                    Cancelar
                </a>

            </div>

        </form>

    </section>

</main>

<!-- RODAPÉ -->
<div th:replace="~{fragments :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
