
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="EstetickElite - Faça login para agendar serviços de estética automotiva.">
    <meta name="keywords"
          content="Estética automotiva, login, cadastro, agendamento">
    <meta name="author" content="Lucas Segura">
    <title>Login | EstetickElite</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <!-- CSS DA PÁGINA -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- HEADER -->
    <!-- CABEÇALHO PRINCIPAL -->
    <header th:replace="~{fragments/header :: header}">
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <div class="cadastro">

            <div class="text-center mb-4">

                <h1>Fazer Login</h1>

                <p style="color: #cccccc;">
                    Faça login ou cadastre-se para agendar um horário
                    e conhecer nossos serviços.
                </p>

            </div>

            <!-- MENSAGEM DE ERRO -->
            <div th:if="${param.erro}"
                 class="alert alert-danger"
                 role="alert">
                E-mail ou senha inválidos. Tente novamente.
            </div>

            <!-- MENSAGEM DE SUCESSO -->
            <div th:if="${param.sucesso}"
                 class="alert alert-success"
                 role="alert">
                Cadastro realizado com sucesso! Faça login para continuar.
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form th:action="@{/login}" method="post">

                <div class="mb-3">

                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="Digite seu e-mail"
                           autocomplete="email"
                           required>

                </div>

                <div class="mb-4">

                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input type="password"
                           id="senha"
                           name="senha"
                           class="form-control"
                           placeholder="Digite sua senha"
                           autocomplete="current-password"
                           required>

                </div>

                <button style=" color: white" type="submit"
                        class="btn btn-estetick w-100">
                    Fazer Login
                </button>

            </form>

            <p class="text-center mt-4">
                Ainda não tem cadastro?
                <a th:href="@{/cadastro}">
                    Cadastre-se
                </a>
            </p>

        </div>

    </main>

    <!-- FOOTER -->
    <footer th:replace="~{fragments/footer :: footer}">


    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


    <!-- JAVASCRIPT PERSONALIZADO -->
    <script th:src="@{/js/script.js}"></script>

</body>

</html>
