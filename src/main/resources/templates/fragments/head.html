
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">

    <!-- CONFIGURAÇÕES -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description"
          content="EstetickElite - Estética automotiva com qualidade, cuidado e excelência.">

    <meta name="author" content="Lucas Segura">

    <meta name="keywords"
          content="estética automotiva, lavagem, polimento, enceramento, vitrificação">

    <!-- TÍTULO -->

        EstetickElite
    </title>

    <!-- FAVICON -->

          type="image/png"
          th:href="@{/favicon.png}">

          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

          th:href="@{/css/style.css}">

</head>
</html>
