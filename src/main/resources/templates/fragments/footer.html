
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<body>

<footer th:fragment="footer">

    <div class="footer-estetick">

        <div class="container footer-container">

            <div class="d-flex flex-wrap justify-content-between
                        align-items-center py-4">

                <!-- DIREITOS AUTORAIS -->
                <p class="col-md-4 mb-0 copyright">

                    © <span th:text="${#dates.year(#dates.createNow())}">
                        2026
                    </span>
                    EstetickElite.
                    Todos os direitos reservados.

                </p>

                <!-- LOGO -->
                <a th:href="@{/}"
                   class="col-md-4 d-flex align-items-center
                          justify-content-center mb-3 mb-md-0 logo-footer">

                    <img th:src="@{/img/logo.png}"
                         alt="Logo EstetickElite"
                         width="40"
                         height="40"
                         class="me-2">

                    Estetick<span>Elite</span>

                </a>

                <!-- MENU -->
                <ul class="nav col-md-4 justify-content-end nav-estetick">

                    <li class="nav-item">
                        <a th:href="@{/}" class="nav-link px-2">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a th:href="@{/cadastro}" class="nav-link px-2">
                            Cadastro
                        </a>
                    </li>

                    <li class="nav-item">
                        <a th:href="@{/agendamento}" class="nav-link px-2">
                            Agendamento
                        </a>
                    </li>

                    <li class="nav-item">
                        <a th:href="@{/faleconosco}" class="nav-link px-2">
                            Fale conosco
                        </a>
                    </li>

                </ul>

            </div>

            <!-- FRASE FINAL -->
            <div class="text-center py-3 linha-dourada">

                <small style="color: #d4af37;">
                    Estética automotiva com qualidade e excelência.
                </small>

            </div>

        </div>

    </div>

</footer>

</body>
</html>
