
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header" class="header-estetick">

    <div class="container">

        <div class="header-container">

            <!-- LOGO -->
            <a th:href="@{/}"
               class="logo-estetick"
               aria-label="Página inicial EstetickElite">

                <img th:src="@{/img/logo.png}"
                     alt="Logo EstetickElite">

                <span>Estetick<span>Elite</span></span>

            </a>

            <!-- MENU PRINCIPAL -->
            <nav aria-label="Menu principal">

                <ul class="nav-estetick">

                    <li>
                        <a th:href="@{/}" class="active">Home</a>
                    </li>

                    <li>
                        <a th:href="@{/cadastro}">Cadastro</a>
                    </li>

                    <li>
                        <a th:href="@{/agendamento}">Agendamento</a>
                    </li>

                    <li>
                        <a th:href="@{/faleconosco}">Fale conosco</a>
                    </li>

                </ul>

            </nav>

            <!-- BOTÕES DE ACESSO -->
            <div class="botoes-header">

                <a th:href="@{/cadastro}" class="btn-cadastrar">
                    Cadastrar
                </a>

                <a th:href="@{/login}" class="btn-agendar">
                    Fazer Login
                </a>

            </div>

        </div>

    </div>

</header>

</body>
</html>
